<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2430"/>
      <stop offset="100%" stop-color="#141B24"/>
    </linearGradient>
    <linearGradient id="trend2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3E9C7F"/>
      <stop offset="100%" stop-color="#D4A24C"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" rx="10" fill="url(#bg2)"/>
  <rect x="1" y="1" width="898" height="218" rx="9" fill="none" stroke="#2A3442" stroke-width="1.5"/>

  <!-- faint ledger grid -->
  <g stroke="#242E3A" stroke-width="1">
    <line x1="40" y1="60" x2="860" y2="60"/>
    <line x1="40" y1="110" x2="860" y2="110"/>
    <line x1="40" y1="160" x2="860" y2="160"/>
  </g>

  <!-- eyebrow -->
  <text x="40" y="44" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3" fill="#6B7A8F">STATUS</text>

  <!-- title placeholder -->
  <text x="40" y="90" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#F3F1EA">PYTHON PROJECTS</text>

  <!-- status line -->
  <g>
    <circle cx="42" cy="122" r="5" fill="#D4A24C"/>
    <text x="58" y="127" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#B9C2CC">In progress — building this week</text>
  </g>

  <!-- tally-to-trend motif, small scale -->
  <g>
    <g stroke="#4A5A6A" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <line x1="600" y1="185" x2="600" y2="165"/>
      <line x1="612" y1="185" x2="612" y2="165"/>
      <line x1="624" y1="185" x2="624" y2="165"/>
      <line x1="636" y1="185" x2="636" y2="165"/>
      <line x1="596" y1="167" x2="640" y2="183"/>
    </g>
    <g stroke="#5E7A73" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <line x1="660" y1="180" x2="660" y2="150"/>
      <line x1="672" y1="180" x2="672" y2="150"/>
      <line x1="684" y1="180" x2="684" y2="150"/>
      <line x1="696" y1="180" x2="696" y2="150"/>
      <line x1="656" y1="152" x2="700" y2="178"/>
    </g>
    <polyline points="720,170 745,145 770,120 800,95 830,70"
      fill="none" stroke="url(#trend2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="830" cy="70" r="5" fill="#D4A24C"/>
  </g>

  <!-- progress bar -->
  <rect x="40" y="150" width="480" height="8" rx="4" fill="#242E3A"/>
  <rect x="40" y="150" width="180" height="8" rx="4" fill="url(#trend2)"/>
  <text x="40" y="178" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1" fill="#6B7A8F">CHECK BACK SOON — UPDATED WEEKLY AS THE MERIT AMERICA PROGRAM PROGRESSES</text>
</svg>
